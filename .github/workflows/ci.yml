name: CI/CD

on:
  push:
    branches:
      - main
      - fase-2-cd-containers
  pull_request:
    branches:
      - main

jobs:
  build-test-and-container:
    name: Build, Test and Container Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Executar build da aplicacao
        run: npm run build --if-present

      - name: Construir imagem Docker
        run: docker build -t devops-na-pratica-fase2:latest .

      - name: Validar execucao do container
        run: |
          docker run -d --name devops-app-test -p 3000:3000 devops-na-pratica-fase2:latest
          sleep 5
          curl --fail http://localhost:3000
          docker logs devops-app-test
          docker stop devops-app-test
          docker rm devops-app-test
